# Tipos documentales para clasificar cada folio.
#
# 1. "titulos": si una de estas frases aparece en las primeras 30 líneas del folio, ese es su
#    tipo (gana el título que aparezca primero).
# 2. Si el folio no tiene título, se asume que continúa el documento del folio anterior.
# 3. Si es el primer folio y no tiene título, se usan las palabras clave:
#    "fuertes" suman 3 puntos y "apoyo" 1 punto.
# Las frases se comparan sin tildes y sin mayúsculas. Se puede editar sin reprogramar.

version: "1.2"
fecha_actualizacion: "2026-10-25"

puntaje_minimo: 3
lineas_titulo: 30

tipos:
  - nombre: FURIPS
    titulos: ["formulario unico de reclamacion", furips]
    fuertes: [furips, "formulario unico de reclamacion"]
    apoyo: [victima, "accidente de transito", propietario, conductor]

  - nombre: SIRAS
    titulos: ["sistema de informacion de reportes", "formulariosiras", "siras"]
    fuertes: [siras]
    apoyo: []

  - nombre: Factura
    titulos: ["factura electronica de venta", "factura de venta"]
    fuertes: ["factura electronica", "factura de venta", cufe]
    apoyo: [factura, subtotal, "valor total"]

  - nombre: Hoja de admisión
    titulos: ["hoja de admision"]
    fuertes: ["hoja de admision"]
    apoyo: []

  - nombre: Historia clínica
    titulos: ["ingreso medico", "historia clinica"]
    fuertes: ["historia clinica", "ingreso medico"]
    apoyo: [anamnesis, antecedentes, "examen fisico", "enfermedad actual", "motivo de consulta"]

  - nombre: Atención inicial de urgencias
    titulos: ["atencion inicial de urgencias"]
    fuertes: ["atencion inicial de urgencias", triage, triaje]
    apoyo: [urgencias]

  - nombre: Epicrisis
    titulos: [epicrisis, "resumen de egreso"]
    fuertes: [epicrisis, "resumen de egreso"]
    apoyo: [egreso]

  - nombre: Notas de evolución
    titulos: ["evolucion medica", "nota de evolucion", "notas de evolucion"]
    fuertes: ["nota de evolucion", "evolucion medica"]
    apoyo: [subjetivo, objetivo, analisis, plan]

  - nombre: Notas de enfermería
    titulos: ["notas de enfermeria", "nota de enfermeria", "administracion de medicamentos", oxigeno]
    fuertes: ["notas de enfermeria"]
    apoyo: []

  - nombre: Órdenes médicas
    titulos: ["orden de interconsulta", "orden de laboratorio", "orden de radiologia", "orden de procedimiento", "orden de insumos", "orden medica", "ordenes medicas"]
    fuertes: ["orden medica", "orden de radiologia", "orden de laboratorio"]
    apoyo: [solicita, ordena]

  - nombre: Fórmulas de medicamentos
    titulos: ["orden de medicamentos", "prescripcion de medicamentos", "formula medica", "medicamentos ambulatorios"]
    fuertes: ["formula medica", "orden de medicamentos", "medicamentos ambulatorios"]
    apoyo: [dosis, posologia]

  - nombre: Descripción quirúrgica
    titulos: ["informe quirurgico", "descripcion quirurgica", "nota operatoria"]
    fuertes: ["descripcion quirurgica", "informe quirurgico"]
    apoyo: [cirujano, anestesiologo]

  - nombre: Materiales de osteosíntesis
    titulos: ["hoja de gastos de material", "remision de material", "material de osteosintesis"]
    fuertes: ["remision de material", "hoja de gastos de material"]
    apoyo: []

  - nombre: Laboratorio y ayudas diagnósticas
    titulos: ["resultados de laboratorio", "laboratorio clinico"]
    fuertes: ["resultados de laboratorio", "valores de referencia"]
    apoyo: [hemograma]

  - nombre: Informes radiológicos
    titulos: ["fecha estudio", "informe radiologico", "informe de imagenes"]
    fuertes: ["informe radiologico", "fecha estudio"]
    apoyo: [radiografia, tomografia, ecografia, resonancia]

  - nombre: Póliza SOAT y documentos del vehículo
    titulos: [soat, "licencia de transito", "seguro obligatorio", "poliza"]
    fuertes: [soat, "licencia de transito"]
    apoyo: [placa, vigencia]

  - nombre: Consulta RUNT
    titulos: ["consulta personas", "consulta vehiculo", "registro unico nacional de transito"]
    fuertes: [runt]
    apoyo: []

  - nombre: Consulta ADRES
    titulos: ["base de datos unica de afiliados", "administradora de los recursos del sistema general"]
    fuertes: ["base de datos unica de afiliados"]
    apoyo: []

  - nombre: Identificaciones
    titulos: ["cedula de ciudadania", "cedula de", "nuip", "tarjeta de identidad", "registrador nacional", "registro civil de nacimiento"]
    fuertes: ["cedula de ciudadania", "registrador nacional"]
    apoyo: []

tipo_por_defecto: Otros
