# Datos que se buscan en cada folio y los patrones para encontrarlos.
#
# - Se aplican sobre el texto SIN tildes y sin distinguir mayúsculas.
# - Cada patrón debe tener un grupo con nombre (?P<valor>...).
# - Comodines: {FECHA} (fechas comunes, incluso "23 JUN 1997" y "30/septiembre/2026"),
#   {NUM_ID} (número de identificación).
# - contexto_excluir: si alguna de esas palabras aparece antes del dato en la misma línea, se descarta.
# - excluir_si_sigue: si alguna aparece en los 120 caracteres siguientes, se descarta
#   (p. ej. "especialidad": es la cédula del médico en su bloque de firma).
# - multiple: true = es normal que haya varios valores.
# - tipo: texto | nombre | fecha | identificacion | placa | codigo | numero | hora
#
# El FURIPS, el SIRAS, la póliza SOAT, la licencia de tránsito y la consulta RUNT tienen
# lectores propios (auditoria/revision/formularios.py) porque son formularios con tablas.
#
# Puede editar este archivo sin reprogramar. Cambie "version" cuando lo modifique.

version: "1.2"
fecha_actualizacion: "2026-10-25"

bloques:
  paciente: "A. Paciente"
  accidente: "B. Accidente"
  administrativo: "C. Datos administrativos"
  clinico: "D. Datos clínicos"
  otros: "E. Otros"

campos:
  # ---------------- A. Paciente ----------------
  - id: paciente.nombre
    etiqueta: Nombre del paciente
    bloque: paciente
    tipo: nombre
    patrones:
      - '(?:nombres? y apellidos(?: del paciente)?|nombre del paciente|nombre de la victima|\bpaciente)\s*[:\-]\s*(?P<valor>[a-z][a-z ]{4,60})'
      - 'nombre del paciente\s+(?P<valor>[a-z][a-z ]{4,60})'
    contexto_excluir: [propietario, conductor, responsable]

  - id: paciente.numero_identificacion
    etiqueta: Número de identificación del paciente
    bloque: paciente
    tipo: identificacion
    patrones:
      - '(?:numero de identificacion|identificacion|documento de identidad|cedula de ciudadania)\s*[:#.]?\s*(?:(?:cc|ti|ce|rc|pa|pe|ppt)\b\.?\s*-?\s*)?(?P<valor>{NUM_ID})'
      - '\b(?:c\.?c\.?|t\.?i\.?|r\.?c\.?|c\.?e\.?)\s*(?:no\.?)?\s*[:#.\-]?\s*(?P<valor>{NUM_ID})'
    contexto_excluir: [propietario, conductor, nit, medico, profesional, registro medico, responsable, tomador]
    excluir_si_sigue: [especialidad, registro medico, cargo, r.m]
    excluir_si_precede: [cargo, especialidad, entregado por, md. rad]

  - id: paciente.fecha_nacimiento
    etiqueta: Fecha de nacimiento
    bloque: paciente
    tipo: fecha
    patrones:
      - 'fecha de nacimiento\s*[:\-]?\s*(?P<valor>{FECHA})'
    contexto_excluir: [propietario, conductor]

  - id: paciente.edad
    etiqueta: Edad registrada
    bloque: paciente
    tipo: numero
    patrones:
      - '\bedad\s*[:\-]?\s*(?P<valor>\d{1,3})\b'

  - id: paciente.sexo
    etiqueta: Sexo
    bloque: paciente
    tipo: codigo
    patrones:
      - '\b(?:sexo|genero|sexo biologico|sexo al momento de nacer)\s*[:\-]?\s*(?P<valor>masculino|femenino|hombre|mujer|m|f)\b'

  - id: paciente.telefono
    etiqueta: Teléfono del paciente
    bloque: paciente
    tipo: identificacion
    multiple: true
    patrones:
      - '(?:telefono|celular|tel\.)\s*[:\-]?\s*(?P<valor>\+?\d[\d \-]{6,14}\d)'
    contexto_excluir: [propietario, conductor, prestador, ips, responsable, parentezco, parentesco, callcenter, pbx, tomador, pagador]

  # ---------------- B. Accidente ----------------
  - id: accidente.fecha
    etiqueta: Fecha del evento
    bloque: accidente
    tipo: fecha
    patrones:
      - '(?:fecha (?:y hora )?(?:del|de|de la) (?:accidente|evento|siniestro|ocurrencia)|fecha hora del evento|fecha evento/accidente)\s*[:\-]?\s*(?P<valor>{FECHA})'

  - id: accidente.hora
    etiqueta: Hora del evento
    bloque: accidente
    tipo: hora
    patrones:
      - '(?:hora (?:del|de) (?:accidente|evento|siniestro|ocurrencia))\s*[:\-]?\s*(?P<valor>\d{1,2}:\d{2})'
      - '(?:fecha (?:y hora )?(?:del|de) (?:accidente|evento)|fecha hora del evento)\s*[:\-]?\s*{FECHA}\s+(?P<valor>\d{1,2}:\d{2})'

  - id: accidente.direccion
    etiqueta: Dirección del evento
    bloque: accidente
    tipo: texto
    patrones:
      - '(?:direccion|lugar) (?:del|de|de la) (?:accidente|evento|ocurrencia|siniestro)\s*[:\-]?\s*(?P<valor>[^\n]{3,80})'

  - id: accidente.zona
    etiqueta: Zona del evento
    bloque: accidente
    tipo: codigo
    patrones:
      - '\bzona(?: del (?:accidente|evento))?\s*[:\-]?\s*(?P<valor>urbana|rural)\b'
    contexto_excluir: [residencia]

  - id: accidente.relato
    etiqueta: Relato de los hechos
    bloque: accidente
    tipo: texto
    multiple: true
    patrones:
      - '(?:relato|descripcion|narracion)(?: breve)? (?:del|de los) (?:accidente|evento|hechos?)\s*[:\-]?\s*(?P<valor>[^\n]{10,300})'

  - id: accidente.calidad_victima
    etiqueta: Calidad del accidentado
    bloque: accidente
    tipo: codigo
    patrones:
      - '(?:condicion|calidad)(?: (?:de la victima|del accidentado|del lesionado|del paciente))?\s*[:\-]?\s*(?P<valor>conductor|peaton|ocupante|pasajero|ciclista|acompanante|motociclista|parrillero|[1-4])\b'

  - id: accidente.placa
    etiqueta: Placa del vehículo
    bloque: accidente
    tipo: placa
    patrones:
      - '\bplaca(?:s)?(?: del vehiculo| no\.?)?\s*[:#\-]?\s*(?P<valor>[a-z][a-z0-9]{2}\s?-?\s?\d{2}[a-z0-9])\b'

  # ---------------- C. Administrativos ----------------
  - id: administrativo.numero_factura
    etiqueta: Número de factura
    bloque: administrativo
    tipo: codigo
    patrones:
      - 'factura(?: electronica)?(?: de venta)?\s*(?:no\.?|n\.?o\.?|numero|#|:)\s*[:#]?\s*(?P<valor>[a-z]{0,6}-?\d{1,12})\b'

  - id: administrativo.numero_poliza
    etiqueta: Número de póliza
    bloque: administrativo
    tipo: identificacion
    patrones:
      - 'poliza(?: soat)?\s*(?:no\.?|n\.?o\.?|numero|#)?\s*[:#]?\s*(?P<valor>\d[\d\-]{5,20}\d)'

  - id: administrativo.vigencia_poliza_desde
    etiqueta: Vigencia de la póliza (desde)
    bloque: administrativo
    tipo: fecha
    patrones:
      - 'vigencia[^\n]{0,20}?desde\s*[:\-]?\s*(?P<valor>{FECHA})'

  - id: administrativo.vigencia_poliza_hasta
    etiqueta: Vigencia de la póliza (hasta)
    bloque: administrativo
    tipo: fecha
    patrones:
      - 'vigencia[^\n]{0,60}?hasta\s*[:\-]?\s*(?P<valor>{FECHA})'

  - id: administrativo.propietario_nombre
    etiqueta: Propietario del vehículo
    bloque: administrativo
    tipo: nombre
    patrones:
      - '(?:nombre del )?propietario(?: del vehiculo)?\s*[:\-]\s*(?P<valor>[a-z][a-z ]{4,60})'

  - id: administrativo.propietario_identificacion
    etiqueta: Identificación del propietario
    bloque: administrativo
    tipo: identificacion
    patrones:
      - 'propietario[^\n]{0,80}?(?:c\.?c\.?|identificacion|documento)\s*(?:no\.?)?\s*[:#.]?\s*(?P<valor>{NUM_ID})'

  - id: administrativo.conductor_nombre
    etiqueta: Conductor del vehículo
    bloque: administrativo
    tipo: nombre
    patrones:
      - '(?:nombre del )?conductor(?: del vehiculo)?\s*[:\-]\s*(?P<valor>[a-z][a-z ]{4,60})'
    contexto_excluir: [estado]

  - id: administrativo.conductor_identificacion
    etiqueta: Identificación del conductor
    bloque: administrativo
    tipo: identificacion
    patrones:
      - 'conductor[^\n]{0,80}?(?:c\.?c\.?|identificacion|documento)\s*(?:no\.?)?\s*[:#.]?\s*(?P<valor>{NUM_ID})'

  # ---------------- D. Clínicos ----------------
  - id: clinico.motivo_consulta
    etiqueta: Motivo de consulta
    bloque: clinico
    tipo: texto
    multiple: true
    patrones:
      - 'motivo de (?:consulta|ingreso)\s*[:\-]?\s*(?P<valor>[^\n]{3,300})'

  - id: clinico.enfermedad_actual
    etiqueta: Enfermedad actual
    bloque: clinico
    tipo: texto
    multiple: true
    patrones:
      - 'enfermedad actual\s*[:\-]?\s*(?P<valor>[^\n]{10,400})'

  - id: clinico.fecha_ingreso
    etiqueta: Fecha de ingreso
    bloque: clinico
    tipo: fecha
    patrones:
      - 'fecha (?:y hora )?(?:de )?ingreso\s*[:\-]?\s*(?P<valor>{FECHA})'
      - '\bingreso\s*:\s*(?P<valor>{FECHA})'

  - id: clinico.hora_ingreso
    etiqueta: Hora de ingreso
    bloque: clinico
    tipo: hora
    patrones:
      - '(?:fecha (?:y hora )?(?:de )?ingreso|\bingreso)\s*[:\-]?\s*{FECHA}\s+(?P<valor>\d{1,2}:\d{2})'

  - id: clinico.fecha_egreso
    etiqueta: Fecha de egreso
    bloque: clinico
    tipo: fecha
    patrones:
      - 'fecha (?:y hora )?(?:de )?(?:egreso|salida|alta)\s*[:\-]?\s*(?P<valor>{FECHA})'
      - '\begreso\s*:\s*(?P<valor>{FECHA})'

  # ---------------- E. Otros ----------------
  - id: runt.documento
    etiqueta: Documento consultado en el RUNT
    bloque: otros
    tipo: identificacion
    patrones: []

  - id: runt.estado_conductor
    etiqueta: Estado del conductor según el RUNT
    bloque: otros
    tipo: texto
    patrones: []
