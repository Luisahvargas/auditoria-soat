# PERFIL DE EJEMPLO (ficticio): muestra cómo ajustar reglas para una aseguradora.
# No corresponde a ninguna aseguradora real. Cópielo, cambie el id y el nombre,
# y ajuste solo lo que la aseguradora haya establecido por escrito.
id: ejemplo_aseguradora
nombre: "Ejemplo de perfil (ficticio)"
descripcion: Ejemplo de cómo desactivar reglas o ajustar severidad y parámetros.

# Reglas que no aplican para esta aseguradora.
reglas_desactivadas: [R18]

# Ajustes por regla: severidad y/o parámetros (se combinan con los de la regla base).
ajustes:
  R13:
    severidad: Alta
    parametros:
      umbral_dias_revision: 5
  R10:
    parametros:
      dias_maximos_accidente_ingreso: 15
